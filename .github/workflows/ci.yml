name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject known token patterns
        run: |
          if rg -n --hidden --glob '!.git/**' --glob '!work/**' 'rpa_[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9_-]{20,}' .; then
            echo 'Potential secret found' >&2
            exit 1
          fi

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e './ml[orb,api,test]'
      - run: python -m unittest discover -s ml/tests -v
      - run: wine-cv prepare-strict --data-root .
      - run: wine-cv validate-field --manifest data/field_mapping.tsv --data-root .
      - run: wine-cv validate-eval-package --manifest eval/queries.tsv --images-dir eval/queries

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - run: frontend/scripts/smoke-demo.sh
